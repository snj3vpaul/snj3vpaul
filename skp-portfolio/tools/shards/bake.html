<!DOCTYPE html>
<!--
  Shard baker for the hero fracture. Not published (nothing on the site links here).
  Run: python3 tools/shards/bake.py   (needs Python Playwright and its Chromium)
  It casts each headline word in the real display face, cuts it into Voronoi shards,
  packs them into img/shards.webp and writes their geometry to shards.js.
  Re-run it whenever the headline, the face, or its letter-spacing changes.
-->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Bodoni Moda'; font-style: normal; font-weight: 400 900; src: url(../../fonts/bodoni-moda-latin-opsz-normal.woff2) format('woff2'); }
@font-face { font-family: 'Bodoni Moda'; font-style: italic; font-weight: 400 900; src: url(../../fonts/bodoni-moda-latin-opsz-italic.woff2) format('woff2'); }
body { font-family: 'Bodoni Moda'; }
</style></head>
<body><span style="font-family:'Bodoni Moda'">a</span><span style="font-family:'Bodoni Moda';font-style:italic">a</span>
<script>
// Must match the hero headline in index.html and its CSS (weight, letter-spacing).
const WORDS = [
  { t: 'Standards', italic: false, line: 1 },
  { t: 'by', italic: false, line: 1 },
  { t: 'trade.', italic: false, line: 1, impact: true },
  { t: 'Curious', italic: true, line: 2 },
  { t: 'by', italic: true, line: 2 },
  { t: 'default.', italic: true, line: 2 },
];
const SIZE = 200, TRACK = -0.025, WEIGHT = 400, CELL = 0.46, ATLAS_W = 2048, GAP = 2;

window.bake = async () => {
  await document.fonts.load(`${WEIGHT} ${SIZE}px "Bodoni Moda"`);
  await document.fonts.load(`italic ${WEIGHT} ${SIZE}px "Bodoni Moda"`);
  let s = 20261125; const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const gauss = () => Math.sqrt(-2 * Math.log(rand() + 1e-9)) * Math.cos(6.2832 * rand());
  const pad = Math.round(SIZE * .3);
  const words = [], pieces = [];

  for (const [wi, w] of WORDS.entries()) {
    const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
    const font = `${w.italic ? 'italic ' : ''}${WEIGHT} ${SIZE}px "Bodoni Moda"`;
    x.font = font; x.letterSpacing = `${TRACK * SIZE}px`;
    const m = x.measureText(w.t);
    const A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent, adv = m.width;
    const W = Math.ceil(adv + pad * 2), H = Math.ceil(A + D + pad * 2);
    c.width = W; c.height = H;
    x.font = font; x.letterSpacing = `${TRACK * SIZE}px`; x.fillStyle = '#fff'; x.textBaseline = 'alphabetic';
    x.fillText(w.t, pad, pad + A);
    const px = x.getImageData(0, 0, W, H).data;

    // seeds: an even scatter over the word, plus a cluster at the point of impact
    const seeds = [];
    const n = Math.max(3, Math.round(adv * (A * .8) / (CELL * SIZE) ** 2));
    for (let i = 0; i < n; i++) seeds.push([pad + rand() * adv, pad + A * .15 + rand() * (A * .95)]);
    let impact = null;
    if (w.impact) {
      impact = [pad + adv * .9, pad + A * .62];
      for (let i = 0; i < 26; i++) seeds.push([impact[0] + gauss() * SIZE * .32, impact[1] + gauss() * SIZE * .2]);
    }

    const owner = new Int16Array(W * H).fill(-1);
    for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
      const k = y * W + xx; if (px[k * 4 + 3] < 8) continue;
      let best = 0, bd = 1e18;
      for (let i = 0; i < seeds.length; i++) { const dx = seeds[i][0] - xx, dy = seeds[i][1] - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
      owner[k] = best;
    }
    const boxes = new Map();
    for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
      const o = owner[y * W + xx]; if (o < 0) continue;
      let b = boxes.get(o); if (!b) boxes.set(o, b = [xx, y, xx, y]);
      if (xx < b[0]) b[0] = xx; if (xx > b[2]) b[2] = xx; if (y < b[1]) b[1] = y; if (y > b[3]) b[3] = y;
    }
    const shards = [];
    for (const [o, b] of boxes) {
      const sw = b[2] - b[0] + 1, sh = b[3] - b[1] + 1;
      if (sw * sh < 4) continue;
      // sprite: A = coverage; R = 255 on a crack edge (where a neighbour belongs to another shard)
      const sp = new ImageData(sw, sh);
      for (let y = 0; y < sh; y++) for (let xx = 0; xx < sw; xx++) {
        const gx = b[0] + xx, gy = b[1] + y, k = gy * W + gx; if (owner[k] !== o) continue;
        const nb = [k + 1, k - 1, k + W, k - W].some(q => q >= 0 && q < owner.length && owner[q] >= 0 && owner[q] !== o);
        const j = (y * sw + xx) * 4;
        sp.data[j] = nb ? 255 : 0; sp.data[j + 1] = 255; sp.data[j + 2] = 255; sp.data[j + 3] = nb ? 255 : px[k * 4 + 3];
      }
      const piece = { sp, x: b[0], y: b[1], w: sw, h: sh, u: 0, v: 0 };
      pieces.push(piece); shards.push(piece);
    }
    words.push({ t: w.t, italic: w.italic, line: w.line, A: +A.toFixed(2), D: +D.toFixed(2), adv: +adv.toFixed(2), W, H, impact, shards });
  }

  // shelf-pack every shard into one atlas
  const order = [...pieces].sort((a, b) => b.h - a.h);
  let cx = GAP, cy = GAP, row = 0;
  for (const p of order) {
    if (cx + p.w + GAP > ATLAS_W) { cx = GAP; cy += row + GAP; row = 0; }
    p.u = cx; p.v = cy; cx += p.w + GAP; row = Math.max(row, p.h);
  }
  const atlasH = cy + row + GAP;
  const atlas = document.createElement('canvas'); atlas.width = ATLAS_W; atlas.height = atlasH;
  const ax = atlas.getContext('2d');
  for (const p of pieces) ax.putImageData(p.sp, p.u, p.v);

  const map = {
    size: SIZE, pad, track: TRACK, weight: WEIGHT, atlas: [ATLAS_W, atlasH],
    words: words.map(w => ({ t: w.t, italic: w.italic, line: w.line, A: w.A, D: w.D, adv: w.adv, W: w.W, H: w.H, impact: w.impact,
      shards: w.shards.map(p => [p.x, p.y, p.w, p.h, p.u, p.v]) })),
  };
  return { png: atlas.toDataURL('image/png'), map, count: pieces.length };
};
</script></body></html>
